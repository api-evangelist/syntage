openapi: 3.2.0
info:
  version: '2020-06-28'
  title: Syntage Financial Institutions Insight API
  contact:
    name: Email
    email: support@syntage.com
  description: '# Introduction


    The Syntage API is organized around REST.'
servers:
- url: https://api.syntage.com
  description: Production
- url: https://api.sandbox.syntage.com
  description: Sandbox
security:
- ApiKey: []
tags:
- name: Financial Institutions Insight
paths:
  /entities/{entityId}/insights/financial-institutions:
    get:
      tags:
      - Financial Institutions Insight
      operationId: GetFinancialInstitutionsInsight
      summary: Get financial institutions
      description: Banks and other financial institutions the entity has transacted with, derived from CFDI payments and third-party accounts on invoices.
      parameters:
      - $ref: '#/components/parameters/entityId'
      - name: options[from]
        in: query
        description: Filter by invoice issuing date (greater than)
        schema:
          type: string
          format: date-time
      - name: options[to]
        in: query
        description: Filter by invoice issuing date (less than)
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Financial Institutions
          content:
            application/ld+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        rfc:
                          $ref: '#/components/schemas/TaxpayerID'
                        legalName:
                          type: string
                          description: Legal name
                          example: CORPORACIóN ALVARADO-TORRES S.A.B.
                        tradeName:
                          type: string
                          description: Commercial name
                          example: CATR
                        website:
                          type: string
                          description: Company website URL
                          example: example.com
                        sector:
                          type: string
                          description: Sector
                          example: Instituciones de banca múltiple
                        total:
                          type: number
                          description: Total amount of all transactions
                          example: 14786.68
                        transactions:
                          type: array
                          items:
                            type: object
                            properties:
                              date:
                                type: string
                                description: Date period
                                example: 2014-01
                              total:
                                type: integer
                                description: Total amount of all transactions in given date period
                                format: int32
                                example: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
  schemas:
    TaxpayerID:
      type: string
      minLength: 12
      maxLength: 13
      description: RFC (Registro Federal de Contribuyentes)
      example: PEIC211118IS0
  parameters:
    entityId:
      name: entityId
      in: path
      required: true
      example: 91106968-1abd-4d64-85c1-4e73d96fb997
      schema:
        type: string
        format: uuid
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'Your API key is available in the [Production](https://app.syntage.com/settings/api-keys) and [Sandbox](https://app.sandbox.syntage.com/settings/api-keys) dashboards.

        '
x-readme:
  explorer-enabled: true
  proxy-enabled: true
  samples-enabled: true
