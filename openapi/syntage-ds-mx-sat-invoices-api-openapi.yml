        schema:
          $ref: '#/components/schemas/InvoiceCertifiedAt'
      - name: certifiedAt[strictly_before]
        in: query
        description: Filter by certified date (less than `<`)
        schema:
          $ref: '#/components/schemas/InvoiceCertifiedAt'
      - name: certifiedAt[after]
