        schema:
          type: number
      - name: discount[gte]
        in: query
        description: Filter by discount (greater than or equal `>=`)
        example: 12.99
        schema:
          type: number
      - name: discount[lt]
        in: query
        description: Filter by discount (less than `<`)
        example: 15.99
        schema:
          type: number
      - name: discount[lte]
        in: query
        description: Filter by discount (less than or equal `<=`)
        example: 15.99
        schema:
          type: number
      - name: subtotal[between]
        in: query
        description: Filter by subtotal between two values
        example: 12.99..15.99
        schema:
          type: string
      - name: subtotal[gt]
        in: query
        description: Filter by subtotal (greater than `>`)
        example: 12.99
        schema:
          type: number
      - name: subtotal[gte]
        in: query
        description: Filter by subtotal (greater than or equal `>=`)
        example: 12.99
        schema:
          type: number
      - name: subtotal[lt]
        in: query
        description: Filter by subtotal (less than `<`)
        example: 15.99
        schema:
          type: number
      - name: subtotal[lte]
        in: query
        description: Filter by subtotal (less than or equal `<=`)
        example: 15.99
        schema:
          type: number
      - name: total[between]
        in: query
        description: Filter by total between two values
        example: 12.99..15.99
        schema:
          type: string
      - name: total[gt]
        in: query
        description: Filter by total (greater than `>`)
        example: 12.99
        schema:
          type: number
      - name: total[gte]
        in: query
        description: Filter by total (greater than or equal `>=`)
        example: 12.99
        schema:
          type: number
      - name: total[lt]
        in: query
        description: Filter by total (less than `<`)
        example: 15.99
        schema:
          type: number
      - name: total[lte]
        in: query
        description: Filter by total (less than or equal `<=`)
        example: 15.99
        schema:
          type: number
      - name: paidAmount[between]
        in: query
        description: Filter by paidAmount between two values
        example: 12.99..15.99
        schema:
          type: string
      - name: paidAmount[gt]
        in: query
        description: Filter by paidAmount (greater than `>`)
        example: 12.99
        schema:
          type: number
      - name: paidAmount[gte]
        in: query
        description: Filter by paidAmount (greater than or equal `>=`)
        example: 12.99
        schema:
          type: number
      - name: paidAmount[lt]
        in: query
        description: Filter by paidAmount (less than `<`)
        example: 15.99
        schema:
          type: number
      - name: paidAmount[lte]
        in: query
        description: Filter by paidAmount (less than or equal `<=`)
        example: 15.99
        schema:
          type: number
      - name: dueAmount[between]
        in: query
        description: Filter by dueAmount between two values
        example: 12.99..15.99
        schema:
          type: string
      - name: dueAmount[gt]
        in: query
        description: Filter by dueAmount (greater than `>`)
        example: 12.99
        schema:
          type: number
      - name: dueAmount[gte]
        in: query
        description: Filter by dueAmount (greater than or equal `>=`)
        example: 12.99
        schema:
          type: number
      - name: dueAmount[lt]
        in: query
        description: Filter by dueAmount (less than `<`)
        example: 15.99
        schema:
          type: number
      - name: dueAmount[lte]
        in: query
        description: Filter by dueAmount (less than or equal `<=`)
        example: 15.99
        schema:
          type: number
      - name: hasXml
        in: query
        description: Filter by invoices that have the CFDI available in XML format
        example: true
        schema:
