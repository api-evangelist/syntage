      - name: hasPdf
        in: query
        description: Filter by invoices that have the CFDI available in PDF format
        example: true
        schema:
          $ref: '#/components/schemas/InvoiceHasPDF'
      - name: order[issuedAt]
        in: query
        description: Order by issue date
        schema:
          $ref: '#/components/schemas/CollectionOrder'
      - name: order[canceledAt]
        in: query
        description: Order by cancellation date
        schema:
          $ref: '#/components/schemas/CollectionOrder'
