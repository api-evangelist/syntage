        example: 12.99
        schema:
          type: number
      - name: dueAmount[gte]
        in: query
        description: Filter by dueAmount (greater than or equal `>=`)
        example: 12.99
        schema:
          type: number
      - name: dueAmount[lt]
        in: query
        description: Filter by dueAmount (less than `<`)
        example: 15.99
        schema:
          type: number
      - name: dueAmount[lte]
        in: query
        description: Filter by dueAmount (less than or equal `<=`)
        example: 15.99
        schema:
          type: number
      - name: hasXml
        in: query
        description: Filter by invoices that have the CFDI available in XML format
        example: true
        schema:
          $ref: '#/components/schemas/InvoiceHasXML'
      - name: hasPdf
        in: query
        description: Filter by invoices that have the CFDI available in PDF format
        example: true
        schema:
          $ref: '#/components/schemas/InvoiceHasPDF'
      - name: order[issuedAt]
        in: query
        description: Order by issue date
        schema:
          $ref: '#/components/schemas/CollectionOrder'
      - name: order[canceledAt]
        in: query
        description: Order by cancellation date
        schema:
          $ref: '#/components/schemas/CollectionOrder'
      - name: order[certifiedAt]
        in: query
        description: Order by certification date
        schema:
          $ref: '#/components/schemas/CollectionOrder'
      - name: order[amount]
        in: query
        description: Order by amount
        schema:
          $ref: '#/components/schemas/CollectionOrder'
      - name: exists[paymentMethod]
        in: query
        description: Filter invoices that contains or not paymentMethod
        schema:
          type: boolean
          example: true
      - $ref: '#/components/parameters/collectionCursorNextPageParam'
      - $ref: '#/components/parameters/collectionCursorPreviousPageParam'
      - $ref: '#/components/parameters/collectionLimit'
      responses:
        '200':
          $ref: '#/components/responses/TaxpayerInvoiceCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    updatedAt:
      type: string
      description: Date and time the resource was last updated
      example: '2020-01-01T12:15:00.000Z'
    CollectionLimit:
      type: integer
      default: 20
      minimum: 1
      maximum: 1000
    MxSatCfdi:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          description: Invoice UUID
          example: def404af-5eef-4112-aa99-d1ec8493b89a
        data:
          type: object
          description: Parsed CFDI data
          additionalProperties: true
        processedXmlAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the CFDI XML was processed
          example: '2020-01-01T12:15:00.000Z'
        processedPdfAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the CFDI PDF was processed
          example: '2020-01-01T12:15:00.000Z'
    InvoiceDiscount:
      type: number
      format: float
      description: Discount amount
      example: 3324
    InvoiceHasXML:
      type: boolean
      description: '`true` when the CFDI is available in the XML format. The file can be downloaded through the [retrieve an invoice CFDI](#operation/GetInvoiceCFDI) operation

        '
    InvoicePac:
      type: string
      minLength: 12
      maxLength: 12
      description: Certification provider tax ID (Proveedor Autorizado de Certificación)
      example: SAT970701NN3
    InvoiceUUID:
      type: string
      format: uuid
      description: Invoice UUID (Folio fiscal)
      example: def404af-5eef-4112-aa99-d1ec8493b89a
    InvoiceIsReceiver:
      type: boolean
      description: '`true` if the invoice receiver is the entity''s RFC

        '
      example: false
    TagInvoicesBatchInput:
      type: object
      required:
      - resources
      - tags
      properties:
        resources:
          type: array
          writeOnly: true
          description: Invoices to tag or untag, as IRI references
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: iri-reference
          example:
          - /invoices/91106968-1abd-4d64-85c1-4e73d96fb997
        tags:
          type: array
          writeOnly: true
          description: Tags to add or remove, as IRI references
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: iri-reference
          example:
          - /tags/018d9dd9-459f-768e-bc55-a8a72d0d3e9a
    Invoice:
      allOf:
      - $ref: '#/components/schemas/InvoiceCollectionItem'
      - type: object
      properties:
        tags:
          $ref: '#/components/schemas/TagCollection'
    InvoiceTax:
      type: number
      format: float
      description: Tax amount
      example: 5224
    InvoiceStatus:
      type: string
      enum:
      - VIGENTE
      - CANCELADO
      description: Whether the invoice is active or canceled
      example: VIGENTE
    TagInvoicesBatch:
      type: object
      properties:
        resources:
          type: array
          description: IDs of the invoices the operation was applied to
          items:
            type: string
            format: uuid
        tags:
          type: array
          description: IDs of the tags added or removed
          items:
            type: string
            format: uuid
    InvoiceRelationRelatedInvoiceUuid:
      type: string
      format: uuid
      description: The related Invoice UUID (Folio fiscal)
      example: def404af-5eef-4112-aa99-d1ec8493b89a
    InvoiceCollection:
      allOf:
      - $ref: '#/components/schemas/CursorCollection'
      - type: object
        properties:
          '@context':
            default: /contexts/Invoice
          '@id':
            default: /entities/{entityId}/invoices
            example: /entities/91106968-1abd-4d64-85c1-4e73d96fb997/invoices
