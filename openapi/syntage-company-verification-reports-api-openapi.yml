          type: string
          format: uuid
          description: Unique company verification report ID
          example: 91ab5678-1234-5678-9abc-def012345678
        link:
          type: string
          format: iri-reference
          description: Entity associated with the company verification report
          example: /entities/91ab5678-1234-5678-9abc-def012345678
        rpcEntity:
          allOf:
          - $ref: '#/components/schemas/RpcEntidadeProfile'
