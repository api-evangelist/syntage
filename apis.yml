- aid: syntage:syntage-ds-mx-sat-invoices-api
  name: Syntage DS MX SAT Invoices API
  description: >-
    Invoices represent CFDI documents issued or received by an entity. Invoice records include SAT identifiers,
    issuer and receiver data, monetary totals, payment status, cancellation status, invoice relationships,
    file availability, and tags.


    Use the entity invoice list when you need all invoices extracted for one entity. Retrieve an invoice
    by ID when you need the full invoice resource, including tags and related invoice metadata. Use the
    CFDI endpoint when you need the XML or PDF content for a specific invoice.


    ### Blacklist status


    The field `issuer.blacklistStatus` or `receiver.blacklistStatus` is set when the invoice issuer or
    receiver

    RFC is found in the [SAT 69-B list](https://omawww.sat.gob.mx/cifras_sat/Paginas/datos/vinculo.html?page=ListCompleta69B.html):


    | Status      | Description |

    |-------------|-----------------------------------------------------------------------------------------------------------|

    | presumed    | SAT has identified possible irregularities and started an investigation |

    | dismissed   | SAT dismissed the investigation after reviewing evidence |

    | definitive  | SAT determined that the RFC has confirmed irregularities |

    | favorable   | SAT reversed a definitive status after reviewing additional evidence |
  humanURL: https://docs.syntage.com/
  baseURL: https://api.syntage.com
  tags:
  - DS MX SAT Invoices
  properties:
  - type: OpenAPI
    url: openapi/syntage-ds-mx-sat-invoices-api-openapi.yml
