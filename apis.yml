- aid: syntage:syntage-shareholders-api
  name: Syntage Shareholders API
  description: >-
    Shareholders represent individuals or entities that own shares in a company. This resource provides
    information about shareholders, their relationships with entities, and the sources of shareholder
    information.


    ### Shareholder Types

    - **physical**: Individual person shareholders

    - **legal**: Corporate entity shareholders

    - **unknown**: When the shareholder type cannot be determined


    ### Relation Types

    - **shareholders**: Indicates the entity's shareholders

    - **shareholder_of**: Indicates entities that this shareholder owns shares in


    ### Source Types

    - **manual**: Manually entered shareholder information

    - **rpc_socio**: Information sourced from RPC (Registro Público de Comercio)

    - **company_verification**: Cap-table shareholders synced from a company verification report
  humanURL: https://docs.syntage.com/
  baseURL: https://api.syntage.com
  tags:
  - Shareholders
  properties:
  - type: OpenAPI
    url: openapi/syntage-shareholders-api-openapi.yml
  - type: APIReference
