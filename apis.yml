- aid: syntage:syntage-ds-mx-sat-tax-compliance-checks-api
  name: Syntage DS MX SAT Tax Compliance Checks API
  description: >-
    A tax compliance check maps the content of Opinion de Cumplimiento de Obligaciones Fiscales, an official
    SAT document that states whether an RFC is complying with its tax obligations. Each tax compliance
    check is a snapshot of the compliance result at a specific check date.


    | Result | Meaning |

    |---|---|

    | `positive` | The RFC is complying with its tax obligations |

    | `negative` | SAT reported one or more compliance issues |

    | `no_obligations` | SAT reported no active tax obligations |

    | `activity_suspended` | SAT reported suspended business activity |
  humanURL: https://docs.syntage.com/
  baseURL: https://api.syntage.com
  tags:
  - DS MX SAT Tax Compliance Checks
  properties:
  - type: OpenAPI
    url: openapi/syntage-ds-mx-sat-tax-compliance-checks-api-openapi.yml
